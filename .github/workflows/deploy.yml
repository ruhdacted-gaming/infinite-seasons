# Builds and deploys the site on every push to main, and twice a day so pages
# roll over to a new season (headings, "current season" text) without a data change.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Just after the usual season start times: 17:00 UTC (Blizzard) and 00:00 UTC (D3, PD2).
    - cron: "30 0 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Runs scripts/check.mjs first, so bad data never reaches the site.
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
