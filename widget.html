<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Diablo Seasons</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="cards.css">
<style>
  /* Compact desktop widget layout. Card styles live in cards.css, rendering in render.js. */
  * { box-sizing: border-box; }
  html { font-size: 13px; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif; line-height: 1.35; }
  body { padding: 10px; }
  header { display: flex; align-items: baseline; justify-content: space-between;
    padding: 2px 4px 10px; }
  header h1 { margin: 0; font: 600 15px/1 Georgia, "Times New Roman", serif;
    letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
  header .clock { color: var(--muted); font-variant-numeric: tabular-nums; }
  footer { color: var(--muted); font-size: 10.5px; padding: 8px 4px 0; display: flex;
    justify-content: space-between; }
  footer.stale { color: var(--warn); }
</style>
</head>
<body>
<header>
  <h1>Diablo Seasons</h1>
  <span class="clock" id="clock"></span>
</header>
<div class="cards" id="grid"></div>
<footer id="footer"></footer>

<script src="seasons.js"></script>
<script src="render.js"></script>
<script>
function render() {
  const S = window.Seasons;
  const now = Date.now();
  const data = window.SEASON_DATA || { games: [] };
  document.getElementById("clock").textContent = S.fmtClock.format(now);
  S.renderCards(document.getElementById("grid"), data, now);

  const footer = document.getElementById("footer");
  const age = S.dataAge(data, now);
  footer.className = age > 30 ? "stale" : "";
  footer.innerHTML = `<span>Data checked ${S.esc(data.verified || "?")}${age > 30 ? " — may be stale, edit seasons.js" : ""}</span>
    <span>~ = estimate</span>`;
}

render();
setInterval(render, 30000);
</script>
</body>
</html>
